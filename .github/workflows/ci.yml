name: CI

# Build, test and pack on every pull request and every push to main (releases: release.yml, for v* tags).
# The same build.ps1 as on a developer's machine: what passes here packs the same way for a release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: Build and test (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to a major version (Dependabot updates them); pin them to a commit SHA for more safety
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The SDK of global.json (10.0.x, latest feature band)
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: NuGet cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The analyzer tests need PowerShell 7: it must be there, otherwise they would be skipped without anyone noticing
      - name: PowerShell 7 for the analyzer tests
        shell: pwsh
        run: |
          $pwsh = (Get-Command pwsh -ErrorAction Stop).Source
          "SHELLY_TEST_PWSH=$pwsh" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SHELLY_REQUIRE_PWSH=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      # Windows PowerShell 5.1 here (what build.ps1 gets on a Windows machine by default); the Release workflow runs it
      # in PowerShell 7, so both are exercised
      - name: Build, test, publish, pack
        shell: powershell
        run: .\build.ps1 all

      - name: Test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 14

      # The zips of this commit (version 1.3.1-dev): to try a pull request without building it
      - name: Zips
        uses: actions/upload-artifact@v7
        with:
          name: shelly-zips
          path: |
            artifacts/dist/*.zip
            artifacts/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
