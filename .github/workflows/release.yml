name: Release

# Push a tag v<VersionPrefix> (v1.3.1) on a commit of main: tests, both zips and SHA256SUMS.txt, a GitHub release
# with the CHANGELOG section of the version and GitHub's generated notes.
on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  release:
    name: Build and publish the release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # Actions are pinned to a major version (Dependabot updates them); pin them to a commit SHA for more safety
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release is built from main only (merged through a pull request)
      - name: Tag is on main
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { Write-Error "$($env:GITHUB_REF_NAME) is not a commit of main"; exit 1 }

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The analyzer tests need PowerShell 7: it must be there, otherwise they would be skipped without anyone noticing
      - name: PowerShell 7 for the analyzer tests
        shell: pwsh
        run: |
          $pwsh = (Get-Command pwsh -ErrorAction Stop).Source
          "SHELLY_TEST_PWSH=$pwsh" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SHELLY_REQUIRE_PWSH=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # build.ps1 checks that the tag is v<VersionPrefix of Directory.Build.props>; no NuGet cache on purpose (a release
      # restores from nuget.org)
      - name: Build, test, publish, pack
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./build.ps1 all -Version $env:TAG

      - name: Release notes
        id: notes
        shell: pwsh
        run: |
          $has = Test-Path artifacts/release-notes.md
          "path=$(if ($has) { 'artifacts/release-notes.md' } else { '' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/dist/*.zip
            artifacts/dist/SHA256SUMS.txt
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
